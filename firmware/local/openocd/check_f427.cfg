# Read-only preflight. Call after init; does not reset, halt, erase or program.
proc sdk11m_check_f427 {} {
    set id [lindex [read_memory 0xE0042000 32 1] 0]
    set kib [lindex [read_memory 0x1FFF7A22 16 1] 0]
    set opt [lindex [read_memory 0x40023C14 32 1] 0]
    set opt1 [lindex [read_memory 0x40023C18 32 1] 0]
    echo "DBGMCU_IDCODE=$id FLASH_KIB=$kib FLASH_OPTCR=$opt FLASH_OPTCR1=$opt1"
    if {($id & 0xfff) != 0x419 || $kib != 2048} { error "Not the confirmed F427-family / 2 MiB target" }
    if {($opt & 0x20) == 0} { error "Hardware watchdog mode requires a different firmware policy" }
    if {(($opt >> 8) & 0xff) != 0xaa} { error "Readout protection active; do not unprotect automatically" }
    if {($opt & 0x80000000) != 0 || (($opt >> 16) & 0xfff) != 0xfff || (($opt1 >> 16) & 0xfff) != 0xfff} {
        error "Unexpected protection configuration; stop for review"
    }
    if {($opt & 0x10) != 0} { error "Unexpected boot-bank option; stop for review" }
    echo "F427_PREFLIGHT_OK"
}
