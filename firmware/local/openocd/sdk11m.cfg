# SDK-1.1M README at bd8cba8f4bd5fc2d1460e6ad4da7b7dd13d9e14d.
# Modern OpenOCD spelling of the official FTDI/JTAG configuration.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0408 0x0ffb
ftdi layout_signal nSRST -oe 0x0800
transport select jtag
set WORKAREASIZE 0x8000
if {![info exists CHIPNAME]} { set CHIPNAME stm32f407 }
set BOARDNAME SDK11M
source [find target/stm32f4x.cfg]
reset_config srst_only srst_nogate
# Cold hardware reset: do not let OpenOCD's default reset-init switch to 64 MHz.
$_TARGETNAME configure -event reset-init {}
adapter speed 1000
